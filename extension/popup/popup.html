<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeetingMind AI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 300px;
      background: #0f0f1a;
      color: #e0e0ff;
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: 13px;
    }

    .header {
      background: #16162a;
      padding: 14px 16px;
      border-bottom: 1px solid #2a2a40;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #6c63ff;
      box-shadow: 0 0 10px #6c63ff;
    }

    .title { font-weight: 700; font-size: 15px; }
    .subtitle { font-size: 11px; color: #666; margin-top: 2px; }

    .body { padding: 14px 16px; }

    .info-card {
      background: #0a0a14;
      border: 1px solid #2a2a40;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .info-card p {
      font-size: 12px;
      color: #888;
      line-height: 1.6;
    }

    .info-card strong { color: #aaa; }

    .sites {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .site-badge {
      background: #1a1a2e;
      border: 1px solid #2a2a40;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 11px;
      color: #888;
    }

    .login-btn {
      width: 100%;
      padding: 11px;
      background: linear-gradient(135deg, #6c63ff, #8b5cf6);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
    }

    .login-btn:hover { opacity: 0.9; }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
    }

    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #2a2a40;
      margin-right: 6px;
    }

    .status-dot.active { background: #6bff8a; box-shadow: 0 0 6px #6bff8a; }

    .status-text { font-size: 12px; color: #666; display: flex; align-items: center; }

    .footer {
      padding: 10px 16px;
      border-top: 1px solid #1a1a2e;
      font-size: 11px;
      color: #444;
      text-align: center;
    }

    a { color: #6c63ff; text-decoration: none; }
  </style>
</head>
<body>
  <div class="header">
    <div class="dot"></div>
    <div>
      <div class="title">MeetingMind AI</div>
      <div class="subtitle">Real-time meeting assistant</div>
    </div>
  </div>

  <div class="body">
    <div class="info-card">
      <p><strong>How it works:</strong><br>
      Join a meeting — MeetingMind automatically opens a floating panel to capture notes, key points, and action items in real-time.</p>

      <div class="sites">
        <span class="site-badge">Google Meet</span>
        <span class="site-badge">Zoom</span>
        <span class="site-badge">Teams</span>
      </div>
    </div>

    <div class="status-row">
      <span class="status-text">
        <span class="status-dot active"></span>
        Extension active
      </span>
      <span style="font-size:11px;color:#6c63ff;">v1.0.0</span>
    </div>

    <button class="login-btn" onclick="openDashboard()">
      Open Dashboard
    </button>
  </div>

  <div class="footer">
    <a href="http://localhost:3000" target="_blank">Dashboard</a> ·
    <a href="#" target="_blank">Help</a>
  </div>

  <script>
    function openDashboard() {
      chrome.tabs.create({ url: 'http://localhost:3000' });
    }
  </script>
</body>
</html>
